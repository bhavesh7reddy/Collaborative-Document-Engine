services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: doc_editor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doc_editor_db"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./DocumentEngineBackend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             daphne -b 0.0.0.0 -p 8000 DocumentEngineBackend.asgi:application"
    ports:
      - "8000:8000"
    volumes:
      - ./DocumentEngineBackend:/app
    environment:
      - DB_HOST=db
      - DB_NAME=doc_editor_db
      - DB_USER=postgres
      - DB_PASSWORD=postgrespassword
      - REDIS_HOST=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./DocumentEngineFrontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./DocumentEngineFrontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: